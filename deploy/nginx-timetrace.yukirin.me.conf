# TimeTrace local web gateway
#
# Runtime topology:
#   tailnet browser -> Tailscale Serve (private HTTPS)
#                   -> 127.0.0.1:19446 nginx
#                |- static SPA: /srv/timetrace/web/current
#                `- API/MCP:   127.0.0.1:8765
#
# This listener is intentionally loopback-only. Tailscale Serve owns HTTPS.
# Do not publish it with Funnel or a public tunnel. In the two maps below,
# replace YOUR_HOST and YOUR_TAILNET with the actual Serve hostname labels and
# uncomment the anchored entries before enabling MCP access. Keep dots escaped
# (the entries are regular expressions). Match the external
# HTTPS port too. Do not use a wildcard or normalize unknown origins.
#
# One-time provisioning on yukirin-server:
#   sudo install -m 644 deploy/nginx-timetrace.yukirin.me.conf \
#     /etc/nginx/sites-available/timetrace
#   sudo ln -sfn /etc/nginx/sites-available/timetrace \
#     /etc/nginx/sites-enabled/timetrace
#   sudo nginx -t && sudo systemctl reload nginx
#
# timetrace-update extracts the SPA bundled in the pulled image to
# releases/<commit SHA> and atomically switches /srv/timetrace/web/current.
# The emergency fallback is publish-frontend.sh.

# These maps live in nginx's http context (sites-enabled is included there).
# Normalize only the known private ingress to the backend's loopback allowlist.
map "$server_port|$http_host" $timetrace_mcp_host {
    default $host;
    # "~*^19446\|YOUR_HOST\.YOUR_TAILNET\.ts\.net:19445$" localhost:8765;
}
map "$server_port|$http_host|$http_origin" $timetrace_mcp_origin {
    default $http_origin;
    # "~*^19446\|YOUR_HOST\.YOUR_TAILNET\.ts\.net:19445\|https://YOUR_HOST\.YOUR_TAILNET\.ts\.net:19445$" http://localhost:8765;
}

server {
    listen 127.0.0.1:19446;
    server_name timetrace.yukirin.me localhost;

    root /srv/timetrace/web/current;
    index index.html;

    client_max_body_size 50M;

    access_log /var/log/nginx/timetrace.access.log;
    error_log  /var/log/nginx/timetrace.error.log;

    # Private Serve ingress: retain the loopback TCP peer. Do not trust the
    # former public proxy's CF-Connecting-IP header on a different ingress.
    # Until a separately validated client-IP mapping is configured, callers
    # share the loopback login rate-limit bucket.

    # Static SPA and client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Normal API traffic.
    location /v1/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # Long-running and streaming API traffic.
    location /v1/agent/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /v1/reports/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /thumbs/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
    }

    location /blob/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
    }

    location = /skill {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
    }

    location = /docs {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
    }

    location = /openapi.json {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # Keep both MCP forms away from the SPA fallback. Return a relative redirect
    # ourselves so the backend cannot construct a Location from the internal
    # loopback host, port, or HTTP scheme.
    absolute_redirect off;
    location = /mcp {
        return 308 /mcp/;
    }

    location /mcp/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host              $timetrace_mcp_host;
        proxy_set_header Origin            $timetrace_mcp_origin;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
