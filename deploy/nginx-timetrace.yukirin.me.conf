# nginx site config for timetrace.yukirin.me — PUBLIC reverse proxy + SPA host.
#
# Lives on the JP/HK VPS (reverse-proxy node), NOT the home box. Deploy:
#   scp deploy/nginx-timetrace.yukirin.me.conf xcy:/etc/nginx/sites-available/timetrace.yukirin.me
#   ssh xcy 'ln -sf /etc/nginx/sites-available/timetrace.yukirin.me /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx'
# The built SPA is published to the docroot AUTOMATICALLY by deploy.yml's
# publish-frontend job on every push to the `deploy` branch (low-priv `ghdeploy`
# user, docroot-only write). Manual fallback: deploy/publish-frontend.sh.
#
# Topology: browser ──HTTPS──► nginx (this VPS) ──┬─ static SPA from docroot
#                                                  └─ /v1 /thumbs /mcp /healthz
#                                                       └─► 127.0.0.1:18765
#                                                            └─ frp tunnel ─► home box 127.0.0.1:8765
#
# The home backend does NOT serve the frontend (per project contract). nginx
# serves the built SPA and proxies only the API surface.

# Port 80: ACME challenge + redirect everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name timetrace.yukirin.me;

    location /.well-known/acme-challenge/ {
        root /var/www/timetrace.yukirin.me;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# Port 443: TLS termination, static SPA, API reverse proxy.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name timetrace.yukirin.me;

    ssl_certificate     /etc/letsencrypt/live/timetrace.yukirin.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/timetrace.yukirin.me/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_prefer_server_ciphers off;

    # Screenshot uploads / blob ingestion (ingest is bearer-gated, but the body
    # still flows through here).
    client_max_body_size 50M;

    # ---- Static SPA (built frontend-dist/) -------------------------------
    root /var/www/timetrace.yukirin.me;
    index index.html;

    # SPA fallback: the app uses react-router BrowserRouter, so deep links
    # (/search, /settings, /login/change-password) and F5-refresh must all
    # return index.html — otherwise nginx 404s on the client-side route.
    # try_files checks for a real file/dir first (hashed JS/CSS assets), then
    # falls back to the SPA entry. API paths below are matched by more-specific
    # location blocks, so they never hit this fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html is the mutable POINTER to the hashed bundle — it must never be
    # browser-cached, or every publish needs users to hard-refresh (Ctrl+Shift+R)
    # before they see the new build. no-cache = revalidate every load (nginx
    # answers 304 when unchanged, so it stays cheap). The SPA fallback above
    # internally redirects here, so deep-link loads get this header too.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Long-cache the content-hashed build assets (index-XXXX.js / .css).
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ---- API surface → frp tunnel → home backend -------------------------
    # Each proxied prefix is its own location so they take precedence over the
    # SPA fallback. Shared proxy params via the map below.
    # NOTE: X-Real-IP is set to $remote_addr (OVERWRITE) — the real client IP
    # as nginx sees it, which the client CANNOT forge. The backend's login
    # rate-limiter keys on X-Real-IP precisely because X-Forwarded-For (append
    # mode below) has an attacker-controllable left-most value. Keep X-Real-IP
    # = $remote_addr; do not switch the rate-limit source to XFF.
    location /v1/ {
        proxy_pass http://127.0.0.1:18765;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Agent chat (/v1/agent/chat) streams its answer as SSE over a possibly-slow
    # local LLM; report generation (/v1/reports/generate) blocks on that same LLM
    # for tens of seconds. Both need buffering OFF (so tokens flush through live)
    # and a long read timeout — the default 60s would cut the answer mid-stream.
    # These are longer prefixes than /v1/ above, so nginx picks them first for
    # their paths (no regex locations here, so longest-prefix wins). Same proxy
    # params as /v1/ + the streaming knobs already proven on /mcp/.
    location /v1/agent/ {
        proxy_pass http://127.0.0.1:18765;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /v1/reports/ {
        proxy_pass http://127.0.0.1:18765;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /thumbs/ {
        proxy_pass http://127.0.0.1:18765;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Full-resolution screenshot originals for lightbox zoom. Mirrors /thumbs/.
    location /blob/ {
        proxy_pass http://127.0.0.1:18765;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /healthz {
        proxy_pass http://127.0.0.1:18765;
        proxy_set_header Host $host;
    }

    # /docs + /openapi.json are cookie-gated backend routes (Swagger UI).
    location = /docs        { proxy_pass http://127.0.0.1:18765; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location = /openapi.json { proxy_pass http://127.0.0.1:18765; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }

    # /skill — backend route returning the Claude Code MCP skill (SKILL.md) as
    # text/markdown for a local agent to download. EXACT match so it beats the
    # SPA fallback (location /); without this, GET /skill hits try_files →
    # index.html and an agent fetching the link gets the HTML page, not the skill.
    location = /skill { proxy_pass http://127.0.0.1:18765; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }

    # MCP streamable-HTTP: SSE / long-lived. Disable buffering + long timeouts.
    location /mcp/ {
        proxy_pass http://127.0.0.1:18765;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
