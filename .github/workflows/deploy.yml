# =============================================================================
# deploy.yml — Manual SSH deploy to the target machine (home small box via
# single-hop FRP reverse tunnel). Companion docs:
#
#   devlogs/infra/archive-202605161000-deployment-architecture.md
#   devlogs/infra/archive-202605161015-cicd-workflow.md
#
# === Topology =================================================================
# Pure FRP, no ProxyJump:
#
#   GH runner ──── public internet ────► cloud:FRP_PORT
#                                              │
#                                              │ FRP reverse tunnel
#                                              ▼
#                                        home box's sshd:22
#
# `ssh -p FRP_PORT vanilla@cloud_ip` lands you straight on the home box.
# The cloud server is a tunnel endpoint only — nothing runs there.
#
# === Self-fetching deploy.sh (no runner-side checkout) ========================
# Runner does NOT clone the repo. It only:
#   1) holds the SSH key,
#   2) opens an ssh control channel to the home box,
#   3) tells the home box to `curl ... deploy/deploy.sh | bash`.
#
# Why: keep "runner only knows SSH credentials, target does everything else".
# The big payloads (git clone of repo + uv sync of PyPI) happen on the home
# box over its own broadband, never round-tripping the runner. This also
# means `ssh GTi13-Ultra-2v4G 'curl ... | bash'` from your laptop reproduces
# CI behavior byte-for-byte for local debugging.
#
# Tradeoff: deploy.sh must exist at the given ref on GitHub raw. If you push
# a new deploy.sh to a branch, the next `gh workflow run --ref <branch>` uses
# THAT version (good). If you want to pin to a specific tested deploy.sh,
# pass `--ref <commit-SHA>` instead of a branch name.
#
# === Trigger ==================================================================
# workflow_dispatch only — no push/tag automation in v1. Run from the GH
# Actions UI (Actions tab → "deploy" → Run workflow) or locally:
#
#     gh workflow run deploy.yml --ref main
#     gh run watch
#
# === Fork safety ==============================================================
# Two layers prevent forks from accidentally deploying to MY machine:
#
#  1. `if: github.repository == '...'` skips the entire job in any fork.
#  2. GitHub doesn't propagate repository secrets to forks, so even if
#     someone removed the guard, all the SSH steps would fail with empty
#     secrets.
#
# A fork user adapting this for their own deploy needs to:
#   - change the repo string in `if:` below
#   - change the GitHub raw URL in the curl step to their fork's path
#   - configure the 4 secrets in their own repo settings
#
# === Required secrets (4) =====================================================
# Configure under repo Settings → Secrets and variables → Actions:
#
#   DEPLOY_SSH_KEY            ed25519 private key (no passphrase) whose .pub
#                             is in the target box's ~/.ssh/authorized_keys.
#   DEPLOY_KNOWN_HOSTS        Output of `ssh-keyscan -p <port> <host>` for
#                             the single hop. Pre-populates known_hosts so we
#                             never hit a "yes/no" prompt at runtime.
#   DEPLOY_TARGET_USER_HOST   "vanilla@121.43.33.13" — the runner → FRP-public
#                             hop's user@host. From the GH runner's viewpoint
#                             this IS the target (FRP makes the home box
#                             reachable directly).
#   DEPLOY_TARGET_PORT        Public port the cloud-side FRP listener exposes,
#                             reverse-tunneled to the home box's sshd:22
#                             (e.g. 10089). This is what `-p` uses.
#
# === Env vars on target (NOT touched by this workflow) =======================
# Server config like VLM API keys lives in ~/TimeTrace/.env on the target.
# That file is in .gitignore and the deploy script does `git reset --hard`
# which only touches tracked files — so .env persists forever across deploys.
# Set it once after the first successful deploy:
#
#     scp -P 10089 .env vanilla@121.43.33.13:~/TimeTrace/.env
#     ssh GTi13-Ultra-2v4G "systemctl --user restart timetrace-server"
# =============================================================================

name: deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch / tag / commit SHA). Default: main"
        required: false
        default: "main"

jobs:
  deploy:
    # Double guard: fork-safe + manual-only.
    if: github.repository == 'Vanilla-Yukirin/TimeTrace' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # First deploy on a slow home upstream can take a while: pip wheels for
    # numpy / Pillow / fastapi etc. add up. 30 min is generous; reduce later.
    timeout-minutes: 30

    steps:
      # No actions/checkout — runner holds zero source files. deploy.sh is
      # fetched from GitHub raw by the target itself in the final step.

      # webfactory/ssh-agent loads DEPLOY_SSH_KEY into an in-memory ssh-agent
      # and exports SSH_AUTH_SOCK so subsequent ssh calls find it. Cleans up
      # on job teardown — the private key never lands on the runner FS.
      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      # known_hosts is plaintext (host pubkeys are not secret), but we keep
      # it in a secret so updates go through repo settings rather than commits.
      - name: Trust target host key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # The one and only deploy step.
      #
      # On the remote bash:
      #   1. set -o pipefail so a curl failure is not masked by bash's exit 0.
      #   2. export TIMETRACE_BRANCH=<ref> so deploy.sh fetches+resets to it.
      #   3. curl deploy.sh from GitHub raw at exactly that ref, pipe to bash.
      #
      # `${REF}` is interpolated on the runner (bash on ubuntu-latest), so the
      # remote box just sees an already-substituted command string.
      - name: Deploy via SSH (target self-fetches deploy.sh)
        env:
          TARGET: ${{ secrets.DEPLOY_TARGET_USER_HOST }}
          TARGET_PORT: ${{ secrets.DEPLOY_TARGET_PORT }}
          REF: ${{ github.event.inputs.ref }}
        run: |
          set -euo pipefail
          DEPLOY_URL="https://raw.githubusercontent.com/Vanilla-Yukirin/TimeTrace/${REF}/deploy/deploy.sh"
          echo "Target  : ${TARGET}:${TARGET_PORT}"
          echo "Ref     : ${REF}"
          echo "Script  : ${DEPLOY_URL}"
          echo ""
          ssh \
            -p "${TARGET_PORT}" \
            -o ServerAliveInterval=15 \
            -o StrictHostKeyChecking=yes \
            "${TARGET}" \
            "set -o pipefail; export TIMETRACE_BRANCH='${REF}'; curl -fsSL '${DEPLOY_URL}' | bash"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Deploy summary"
            echo "- Repo: ${{ github.repository }}"
            echo "- Ref: ${{ github.event.inputs.ref }}"
            echo "- Outcome: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
