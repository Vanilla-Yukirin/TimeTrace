# =============================================================================
# deploy.yml — GitOps production deploy: backend over FRP SSH + SPA to xcy.
# Companion docs:
#
#   devlogs/infra/archive-202605161000-deployment-architecture.md
#   devlogs/infra/archive-202605161015-cicd-workflow.md
#
# === Topology =================================================================
# Pure FRP, no ProxyJump:
#
#   GH runner ──── public internet ────► cloud:FRP_PORT
#                                              │
#                                              │ FRP reverse tunnel
#                                              ▼
#                                        home box's sshd:22
#
# `ssh -p FRP_PORT vanilla@cloud_ip` lands you straight on the home box.
# The cloud server is a tunnel endpoint only — nothing runs there.
#
# === Backend self-fetching deploy.sh (no backend checkout) ====================
# A tiny resolver job first pins the requested ref to one commit SHA. The
# backend deploy job itself does not clone the repo. It only:
#   1) holds the SSH key,
#   2) opens an ssh control channel to the home box,
#   3) tells the home box to refresh deploy/deploy.sh from its OWN clone via
#      git, then run it.
#
# The private repo must already be cloned and authenticated on the box. The
# deploy job fetches the resolved SHA, checks out that SHA's deploy.sh, and
# passes the same SHA into the script. The frontend job checks out that exact
# SHA on the runner to build the SPA.
#
# === Trigger ==================================================================
# Two ways in:
#   1. Push-to-deploy (GitOps): pushing to the `deploy` branch auto-deploys
#      origin/deploy. Normal work lands on main (NO deploy); when you actually
#      want to ship, one command does it:
#          git push origin main:deploy
#      (fast-forwards the remote `deploy` branch to main's HEAD → fires this
#      workflow → box resets to origin/deploy). Only push `deploy` when you mean
#      to deploy; WIP stays on a short-lived topic branch or local worktree.
#   2. workflow_dispatch (manual escape hatch): deploy ANY ref from the GH
#      Actions UI (Actions → "deploy" → Run workflow) or locally:
#          gh workflow run deploy.yml --ref main -f ref=<branch|tag|sha>
#          gh run watch
#
# === Fork safety ==============================================================
# Two layers prevent forks from accidentally deploying to MY machine:
#
#  1. `if: github.repository == '...'` skips the entire job in any fork.
#  2. GitHub doesn't propagate repository secrets to forks, so even if
#     someone removed the guard, all the SSH steps would fail with empty
#     secrets.
#
# A fork user adapting this for their own deploy needs to:
#   - change the repo string in `if:` below
#   - configure the 4 secrets in their own repo settings
#
# === Required secrets (4 backend + 3 frontend) ================================
# Configure under repo Settings → Secrets and variables → Actions:
#
#   DEPLOY_SSH_KEY            ed25519 private key (no passphrase) whose .pub
#                             is in the target box's ~/.ssh/authorized_keys.
#   DEPLOY_KNOWN_HOSTS        Output of `ssh-keyscan -p <port> <host>` for
#                             the single hop. Pre-populates known_hosts so we
#                             never hit a "yes/no" prompt at runtime.
#   DEPLOY_TARGET_USER_HOST   "vanilla@121.43.33.13" — the runner → FRP-public
#                             hop's user@host. From the GH runner's viewpoint
#                             this IS the target (FRP makes the home box
#                             reachable directly).
#   DEPLOY_TARGET_PORT        Public port the cloud-side FRP listener exposes,
#                             reverse-tunneled to the home box's sshd:22
#                             (e.g. 10089). This is what `-p` uses.
#
# publish-frontend job (SPA → xcy reverse-proxy VPS docroot):
#
#   XCY_SSH_KEY               ed25519 private key for the DEDICATED low-priv
#                             `ghdeploy` user on xcy (owns ONLY the frontend
#                             docroot, no sudo). Deliberately NOT root: a leaked
#                             key swaps static files, it does not take the
#                             reverse-proxy box.
#   XCY_KNOWN_HOSTS           `ssh-keyscan -p 22000 -t ed25519 <xcy-ip>` line.
#   XCY_TARGET                "ghdeploy@<xcy-ip>" (user@host; port is the
#                             XCY_PORT env below).
#
# === Env vars on target (NOT touched by this workflow) =======================
# Server config like VLM API keys lives in ~/Github/TimeTrace/.env on the target.
# That file is in .gitignore and the deploy script does `git reset --hard`
# which only touches tracked files — so .env persists forever across deploys.
# Provision it once outside git; after changing it, trigger the normal workflow
# so restart + health check still have an Actions record:
#
#     scp -P 10089 .env vanilla@121.43.33.13:~/Github/TimeTrace/.env
#     gh workflow run deploy.yml --ref main -f ref=main
# =============================================================================

name: deploy

# Serialize production mutations. Do not cancel a run midway through an atomic
# publish/deploy sequence; the queued run deploys its own immutable SHA next.
concurrency:
  group: timetrace-production
  cancel-in-progress: false

on:
  # Push-to-deploy: a push to the `deploy` branch ships it. main is the only
  # long-lived development branch; deploy is a production pointer to a tested
  # main commit and must not receive direct development work.
  push:
    branches: [deploy]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch / tag / commit SHA). Default: main"
        required: false
        default: "main"

jobs:
  resolve-ref:
    if: github.repository == 'Vanilla-Yukirin/TimeTrace'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve requested ref to one immutable commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.ref }}
          fetch-depth: 1

      - name: Export commit SHA
        id: resolve
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    # Double guard: fork-safe (repo check) + only our two intended triggers
    # (manual dispatch or a push to `deploy`).
    if: github.repository == 'Vanilla-Yukirin/TimeTrace' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    needs: resolve-ref
    runs-on: ubuntu-latest
    # First deploy on a slow home upstream can take a while: pip wheels for
    # numpy / Pillow / fastapi etc. add up. 30 min is generous; reduce later.
    timeout-minutes: 30

    steps:
      # No actions/checkout — runner holds zero source files. deploy.sh is
      # fetched from GitHub raw by the target itself in the final step.

      # webfactory/ssh-agent loads DEPLOY_SSH_KEY into an in-memory ssh-agent
      # and exports SSH_AUTH_SOCK so subsequent ssh calls find it. Cleans up
      # on job teardown — the private key never lands on the runner FS.
      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      # known_hosts is plaintext (host pubkeys are not secret), but we keep
      # it in a secret so updates go through repo settings rather than commits.
      - name: Trust target host key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # The one and only deploy step.
      #
      # The target box bootstraps deploy.sh from its own authenticated clone.
      #
      # On the remote bash:
      #   1. set -o pipefail so a mid-pipe failure isn't masked.
      #   2. cd into the existing clone (first-ever provisioning is separate).
      #   3. git fetch the requested ref → checkout just deploy/deploy.sh from
      #      it (so we run the ref's version of the script, not a stale local).
      #   4. export TIMETRACE_BRANCH=<ref> + run deploy.sh (it does the real
      #      fetch + reset --hard + uv sync + restart + healthz).
      #
      # `${REF}` is interpolated on the runner, so the box sees a substituted
      # command string.
      - name: Deploy via SSH (target self-fetches deploy.sh via git)
        env:
          TARGET: ${{ secrets.DEPLOY_TARGET_USER_HOST }}
          TARGET_PORT: ${{ secrets.DEPLOY_TARGET_PORT }}
          REF: ${{ needs.resolve-ref.outputs.sha }}
        run: |
          set -euo pipefail
          echo "Target  : ${TARGET}:${TARGET_PORT}"
          echo "Ref     : ${REF}"
          echo ""
          ssh \
            -p "${TARGET_PORT}" \
            -o ServerAliveInterval=15 \
            -o StrictHostKeyChecking=yes \
            "${TARGET}" \
            "set -o pipefail; cd \"\$HOME/Github/TimeTrace\" && git fetch origin '${REF}' && git checkout FETCH_HEAD -- deploy/deploy.sh && export TIMETRACE_BRANCH='${REF}' && bash deploy/deploy.sh"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Deploy summary"
            echo "- Repo: ${{ github.repository }}"
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Ref: ${{ needs.resolve-ref.outputs.sha }}"
            echo "- Outcome: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # publish-frontend — build the SPA on the runner and push it to the xcy
  # reverse-proxy VPS docroot (which is what timetrace.yukirin.me serves).
  #
  # Exists because this used to be a MANUAL `npm run build && scp` step that
  # nobody remembered to run — the public frontend once sat 3 weeks stale while
  # the backend deployed on every push. Workflow-izing it turns "must remember"
  # into "can't forget" (same discipline the backend job already follows).
  #
  # Runs PARALLEL to the backend job, independent failure domains: a broken
  # frontend build doesn't block the backend rollout, and vice versa. No path
  # filter on purpose — build+rsync is minute-scale and idempotent; publishing
  # every deploy beats guessing whether the diff touched frontend/.
  #
  # Update order matters: hashed assets first, index.html LAST — a visitor
  # mid-publish gets either the old page (old assets still present; rsync
  # doesn't delete) or the new page (new assets already there), never a page
  # pointing at missing chunks. nginx serves index.html with
  # Cache-Control: no-cache so browsers pick up the new pointer on reload.
  #
  # Emergency manual fallback (CI down): deploy/publish-frontend.sh.
  # ---------------------------------------------------------------------------
  publish-frontend:
    if: github.repository == 'Vanilla-Yukirin/TimeTrace' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    needs: resolve-ref
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      XCY_PORT: "22000"
      DOCROOT: /var/www/timetrace.yukirin.me

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build SPA
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend   # tsc -b && vite build → frontend-dist/

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.XCY_SSH_KEY }}

      - name: Trust xcy host key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.XCY_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Publish to xcy docroot (assets first, index.html last)
        env:
          TARGET: ${{ secrets.XCY_TARGET }}
        run: |
          set -euo pipefail
          RSH="ssh -p ${XCY_PORT} -o StrictHostKeyChecking=yes"
          # 1) everything except the entry point (hashed assets are new names —
          #    old ones stay behind for tabs still holding the previous page)
          rsync -rtz -e "$RSH" --exclude index.html frontend-dist/ "${TARGET}:${DOCROOT}/"
          # 2) flip the pointer
          rsync -tz -e "$RSH" frontend-dist/index.html "${TARGET}:${DOCROOT}/index.html"
          echo "Published bundle: $(grep -oE 'index-[A-Za-z0-9_-]+\.js' frontend-dist/index.html | head -1)"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Frontend publish summary"
            echo "- Ref: ${{ needs.resolve-ref.outputs.sha }}"
            echo "- Outcome: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
