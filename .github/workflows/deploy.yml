# Production artifact publication:
#   deploy branch -> GitHub Actions -> immutable GHCR image
#   deployment host -> timetrace-update -> pull, health-check, activate

name: deploy

concurrency:
  group: timetrace-production-image
  cancel-in-progress: false

on:
  push:
    branches: [deploy]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/vanilla-yukirin/timetrace-server

jobs:
  resolve-ref:
    if: github.repository == 'Vanilla-Yukirin/TimeTrace'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Checkout immutable trigger commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Export commit SHA
        id: resolve
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-image:
    if: github.repository == 'Vanilla-Yukirin/TimeTrace'
    needs: resolve-ref
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout immutable release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server plus SPA image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ needs.resolve-ref.outputs.sha }}
          build-args: |
            VCS_REF=${{ needs.resolve-ref.outputs.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Summary
        if: always()
        run: |
          {
            echo "## Pull-based release artifact"
            echo "- Ref: ${{ needs.resolve-ref.outputs.sha }}"
            echo "- Image: \`${IMAGE_NAME}:${{ needs.resolve-ref.outputs.sha }}\`"
            echo "- Contents: server + SPA + Compose deployment assets"
            echo "- Activation: run \`timetrace-update\` on the deployment host"
            echo "- Outcome: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
