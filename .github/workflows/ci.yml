name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check src/

      - name: Format check (ruff)
        run: uv run ruff format --check src/

      - name: Run tests
        run: uv run pytest --tb=short

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Lint
        run: npm run lint --prefix frontend

      - name: Build
        run: npm run build --prefix frontend

  docker-image:
    # The deploy workflow builds the production image. Keep this job on PRs so
    # container changes are validated once, without rebuilding after merge.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          tags: timetrace-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test hardened container
        run: |
          set -euo pipefail
          DATA_DIR="${RUNNER_TEMP}/timetrace-data"
          TOKEN_DIR="${RUNNER_TEMP}/timetrace-tokens"
          sudo install -d -o 1000 -g 1000 "${DATA_DIR}" "${TOKEN_DIR}"

          cleanup() {
            docker logs timetrace-ci 2>&1 || true
            docker rm -f timetrace-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d \
            --name timetrace-ci \
            --network host \
            --read-only \
            --tmpfs /tmp:size=256m,mode=1777 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --mount type=bind,src="${DATA_DIR}",dst=/home/timetrace/TimeTraceData \
            --mount type=bind,src="${TOKEN_DIR}",dst=/home/timetrace/.config/timetrace-server \
            timetrace-server:ci

          for attempt in $(seq 1 24); do
            if curl -fsS --max-time 5 http://127.0.0.1:8765/healthz >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1
