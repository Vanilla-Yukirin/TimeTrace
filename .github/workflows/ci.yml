name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  quality-gate:
    if: always()
    needs: [lint-and-test, frontend, e2e, docker-image]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful acceptance
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          for job, result in results.items():
              allowed = {'success', 'skipped'} if job == 'docker-image' else {'success'}
              assert result['result'] in allowed, f"{job}: {result['result']}"
          PY

  lint-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.5"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run python scripts/check.py lint

      - name: Run tests
        run: uv run python scripts/check.py unit

      - name: Build Windows client package
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows/build-client.ps1

      - name: Verify Windows client package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (uv run python -c "from timetrace import __version__; print(__version__)").Trim()
          ./scripts/windows/verify-client-package.ps1 -ExpectedVersion $version

      - name: Test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        run: ./scripts/windows/test-client-installer.ps1

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-${{ matrix.os }}
          path: artifacts/unit.xml

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Two-container acceptance
        run: python scripts/check.py e2e
      - name: Upload logs, metrics, browser trace and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-container-e2e
          path: artifacts/
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Frontend checks
        run: python scripts/check.py frontend

  docker-image:
    # Deployment compatibility and hardening checks supplement the shared E2E.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Test deployment compatibility guard
        run: bash deploy/tests/test-compatibility-guard.sh

      - name: Test web gateway checks
        run: bash deploy/tests/test-web-gateway.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          tags: timetrace-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify both runtime CA bundles
        run: |
          docker run --rm -i --network none --read-only \
            --entrypoint python timetrace-server:ci - < deploy/tests/check-ca-bundles.py

      - name: Smoke-test hardened container
        run: |
          set -euo pipefail
          DATA_DIR="${RUNNER_TEMP}/timetrace-data"
          TOKEN_DIR="${RUNNER_TEMP}/timetrace-tokens"
          LEGACY_ENV="${RUNNER_TEMP}/timetrace-legacy.env"
          NORMALIZED_ENV="${RUNNER_TEMP}/timetrace-normalized.env"
          sudo install -d -o 1000 -g 1000 "${DATA_DIR}" "${TOKEN_DIR}"

          # Validate the real OCI label and a row visible only through an open
          # SQLite WAL using the exact production guard/container path.
          TIMETRACE_TEST_IMAGE=timetrace-server:ci \
            bash deploy/tests/test-compatibility-guard.sh

          cat >"${LEGACY_ENV}" <<'EOF'
          TIMETRACE_VLM_API_KEY="abc$TOKEN"
          TIMETRACE_TEST_PATH='C:\models\vlm'
          EOF
          docker run --rm \
            --network none \
            --read-only \
            --user "$(id -u):$(id -g)" \
            --mount type=bind,src="${LEGACY_ENV}",dst=/tmp/timetrace-legacy.env,readonly \
            --entrypoint python \
            timetrace-server:ci \
            -m timetrace.common.dotenv_normalizer \
            /tmp/timetrace-legacy.env >"${NORMALIZED_ENV}"
          TIMETRACE_IMAGE_REF=timetrace-server:ci \
            TIMETRACE_IMAGE=timetrace-server \
            TIMETRACE_IMAGE_TAG=ci \
            TIMETRACE_HOST_UID=1000 \
            TIMETRACE_HOST_GID=1000 \
            TIMETRACE_ENV_FILE="${NORMALIZED_ENV}" \
            TIMETRACE_DATA_DIR="${DATA_DIR}" \
            TIMETRACE_TOKEN_DIR="${TOKEN_DIR}" \
            docker compose -p timetrace-env-ci -f deploy/docker-compose.yml \
            run --rm --no-deps --entrypoint python server -c \
            'import os; assert os.environ["TIMETRACE_VLM_API_KEY"] == "abc$TOKEN"; assert os.environ["TIMETRACE_TEST_PATH"] == r"C:\models\vlm"'

          cleanup() {
            docker logs timetrace-ci 2>&1 || true
            docker rm -f timetrace-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d \
            --name timetrace-ci \
            --network host \
            --read-only \
            --tmpfs /tmp:size=256m,mode=1777 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --mount type=bind,src="${DATA_DIR}",dst=/home/timetrace/TimeTraceData \
            --mount type=bind,src="${TOKEN_DIR}",dst=/home/timetrace/.config/timetrace-server \
            timetrace-server:ci

          for attempt in $(seq 1 24); do
            if curl -fsS --max-time 5 http://127.0.0.1:8765/healthz >/dev/null; then
              curl -fsS --max-time 5 http://127.0.0.1:8765/skill \
                | grep -F 'name: timetrace' >/dev/null
              exit 0
            fi
            sleep 5
          done
          exit 1
