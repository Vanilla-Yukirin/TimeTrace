  #   image: postgres:16-alpine
  #   profiles: ["pg"]
  #   environment:
  #     POSTGRES_USER: timetrace
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
  #     POSTGRES_DB: timetrace
  #   volumes:
  #     - ./pgdata:/var/lib/postgresql/data
  #
  # redis:
