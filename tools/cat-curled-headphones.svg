<svg
  width="120"
  height="120"
  viewBox="0 0 120 120"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <!-- Body Fill Gradient: White to very soft lavender/blue shading -->
    <linearGradient id="body-fill" x1="20" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f2f4fa" />
      <stop offset="100%" stop-color="#e2e6f3" />
    </linearGradient>

    <!-- Headphone Gradient: Soft pastel blue to match the reference collar -->
    <linearGradient id="hp-grad" x1="40" y1="20" x2="80" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#90cdf4" />
      <stop offset="100%" stop-color="#63b3ed" />
    </linearGradient>

    <!-- Gold accent for headphones (matching the bell) -->
    <linearGradient id="gold-grad" x1="0" y1="0" x2="0" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbd38d" />
      <stop offset="100%" stop-color="#d69e2e" />
    </linearGradient>

    <!-- Filter for soft bloom -->
    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes music-pulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.05); opacity: 1; }
      }
      .pulse { 
        animation: music-pulse 2s ease-in-out infinite; 
        transform-box: fill-box;
        transform-origin: center;
      }
      
      @keyframes ear-twitch {
        0%, 90%, 100% { transform: rotate(0deg); }
        95% { transform: rotate(-4deg); }
      }
      .ear { 
        transform-origin: center; 
        animation: ear-twitch 4s infinite; 
      }
      .outline {
        stroke: #b8c2e0; /* Soft grey-purple outline from reference */
        stroke-width: 1.5;
        stroke-linejoin: round;
      }
    </style>
  </defs>

  <!-- Main Body - Curled up -->
  <path
    class="outline"
    d="M95 85 C105 70 100 45 80 40 C60 35 40 45 35 65 C30 85 45 105 70 105 C85 105 95 95 95 85 Z"
    fill="url(#body-fill)"
  />

  <!-- Tail - Wrapping around -->
  <path
    class="outline"
    d="M35 85 C20 85 15 65 25 55 C30 50 40 55 38 65"
    stroke-width="12"
    stroke-linecap="round"
    fill="none"
  />
  <!-- Tail inner fill to cover the stroke overlap slightly -->
  <path
    d="M35 85 C20 85 15 65 25 55 C30 50 40 55 38 65"
    stroke="url(#body-fill)"
    stroke-width="9"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Head - Slightly tilted -->
  <g transform="translate(60, 45) rotate(-10)">
    <!-- Back Ear -->
    <g class="ear">
      <path class="outline" d="M-22 -15 L-28 -40 L-5 -25 Z" fill="url(#body-fill)" />
      <path d="M-20 -18 L-24 -32 L-8 -22 Z" fill="#ffd1df" opacity="0.8" />
    </g>
    
    <!-- Front Ear -->
    <g class="ear">
      <path class="outline" d="M22 -15 L28 -40 L5 -25 Z" fill="url(#body-fill)" />
      <path d="M20 -18 L24 -32 L8 -22 Z" fill="#ffd1df" opacity="0.8" />
    </g>

    <!-- Head shape -->
    <circle class="outline" cx="0" cy="0" r="28" fill="url(#body-fill)" />
    
    <!-- Face - Bright Blue Eyes like reference -->
    <g transform="translate(0, 5)">
      <!-- Left Eye -->
      <path d="M-19 -2 Q-12 -8 -5 -2 Q-12 4 -19 -2" fill="white" />
      <circle cx="-12" cy="-1" r="5.5" fill="#2b6cb0" /> <!-- Dark blue edge -->
      <circle cx="-12" cy="-1" r="4" fill="#63b3ed" /> <!-- Light blue inner -->
      <circle cx="-13" cy="-3" r="2" fill="white" /> <!-- Main highlight -->
      <circle cx="-10" cy="1" r="1" fill="#e2e8f0" opacity="0.8" /> <!-- secondary highlight -->
      <!-- Eyeliner/Lashes -->
      <path d="M-20 -2 Q-12 -9 -4 -2" stroke="#2d3748" stroke-width="2" fill="none" stroke-linecap="round" />
      <path d="M-19 -2 L-21 -4" stroke="#2d3748" stroke-width="1.5" fill="none" stroke-linecap="round" />

      <!-- Right Eye -->
      <path d="M5 -2 Q12 -8 19 -2 Q12 4 5 -2" fill="white" />
      <circle cx="12" cy="-1" r="5.5" fill="#2b6cb0" />
      <circle cx="12" cy="-1" r="4" fill="#63b3ed" />
      <circle cx="11" cy="-3" r="2" fill="white" />
      <circle cx="14" cy="1" r="1" fill="#e2e8f0" opacity="0.8" />
      <!-- Eyeliner/Lashes -->
      <path d="M4 -2 Q12 -9 20 -2" stroke="#2d3748" stroke-width="2" fill="none" stroke-linecap="round" />
      <path d="M19 -2 L21 -4" stroke="#2d3748" stroke-width="1.5" fill="none" stroke-linecap="round" />

      <!-- Nose (Soft Pink) -->
      <path d="M-1.5 6 L1.5 6 L0 8 Z" fill="#ff9eb5" />

      <!-- Mouth -->
      <path d="M-3 9 Q0 11 3 9" stroke="#718096" stroke-width="1" stroke-linecap="round" fill="none" />
      
      <!-- Whiskers -->
      <path d="M-15 8 L-25 10 M-15 11 L-24 14" stroke="#cbd5e1" stroke-width="1" stroke-linecap="round" />
      <path d="M15 8 L25 10 M15 11 L24 14" stroke="#cbd5e1" stroke-width="1" stroke-linecap="round" />
    </g>

    <!-- Headphones - Over the ears -->
    <!-- Headband -->
    <path d="M-31 -8 A 33 33 0 0 1 31 -8" stroke="#4a5568" stroke-width="4" fill="none" />
    
    <!-- Earcups (Soft Blue matching collar) -->
    <g class="pulse">
      <rect x="-37" y="-14" width="12" height="22" rx="5" fill="url(#hp-grad)" />
      <rect x="-36" y="-10" width="4" height="14" rx="2" fill="url(#gold-grad)" /> <!-- Gold accent -->
    </g>
    
    <g class="pulse">
      <rect x="25" y="-14" width="12" height="22" rx="5" fill="url(#hp-grad)" />
      <rect x="32" y="-10" width="4" height="14" rx="2" fill="url(#gold-grad)" /> <!-- Gold accent -->
    </g>
  </g>

  <!-- Decorative Music Notes (Blue/Gold to match) -->
  <path
    class="pulse"
    d="M95 25 L95 15 L102 17"
    stroke="#63b3ed"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    style="animation-delay: 0.5s"
  />
  <circle class="pulse" cx="94" cy="26" r="2" fill="#63b3ed" style="animation-delay: 0.5s" />
</svg>
