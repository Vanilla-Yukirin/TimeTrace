[project]
name = "timetrace"
version = "0.1.0"
description = "Local-first desktop activity memory layer for Windows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # API server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # Screenshot capture
    "mss>=9.0.0",
    # Database
    "aiosqlite>=0.20.0",
    # Data validation
    "pydantic>=2.7.0",
    # Structured logging
    "structlog>=24.1.0",
    # Windows window API (Phase 1)
    "pywin32>=306",
    # Image processing / thumbnails (Phase 1)
    "Pillow>=10.0.0",
    # Keyboard/mouse monitoring for idle detection (Phase 1)
    "pynput>=1.7.0",
    # System tray icon (Phase 1)
    "pystray>=0.19.0",
    # Numerical operations (pHash DCT, Phase 1)
    "numpy>=1.26.0",
    # VLM client (OpenAI-compatible chat completions, Phase 1.5)
    "openai>=1.30.0",
    # Load VLM credentials from .env at startup
    "python-dotenv>=1.0.0",
]

[project.scripts]
# Single-process all-in-one (capture + API + DB + worker + tray). Stable default.
timetrace = "timetrace.main:main"
# Two-process split (P3a-5b). Run alongside each other for loopback,
# or deploy server on a remote host and point client.toml at it.
timetrace-client = "timetrace.client.cli:main"
timetrace-server = "timetrace.server.cli:main"

# Optional-dependencies are forward-looking buckets — none of them are pulled
# in by `uv sync` today. Each maps to a phase in the kickoff devlog
# (devlogs/infra/archive-202605151200-client-server-split-kickoff.md) and is
# wired into the runtime when that phase lands.
#
# At P3a we will additionally split the current `dependencies` list into
# `client` / `server` / common buckets so you can install just one half, but
# while main.py still runs both halves in one process the union form here is
# what users actually need.
[project.optional-dependencies]
# P4 — client-side privacy pipeline (OCR + classifier + blur)
client-priv = [
    # "paddleocr>=2.7.0",
    # "onnxruntime>=1.17.0",
]
# P5 — server adapters
server-pg = [
    # "asyncpg>=0.29.0",
]
server-redis = [
    # "redis>=5.0.0",
]
server-s3 = [
    # "boto3>=1.34.0",
]
# P6 — headless TUI client (Linux small box)
headless = [
    # "psutil>=5.9.0",
]
# Convenience: install every optional bucket for single-machine setups.
# Empty until any of the above buckets is actually populated.
all = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/timetrace"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.9",
]
