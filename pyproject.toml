[project]
name = "timetrace"
version = "0.1.0"
description = "Local-first desktop activity memory layer (Windows capture client + cross-platform server)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # === Cross-platform: server + client common ===
    "pydantic>=2.7.0",                 # data validation everywhere
    "structlog>=24.1.0",               # structured logging
    "python-dotenv>=1.0.0",            # .env at startup (VLM creds, etc.)
    "Pillow>=10.0.0",                  # image processing (thumbnails, server blob)
    "numpy>=1.26.0",                   # pHash DCT
    "httpx>=0.28.1",                   # HttpBackend (client side) + tests
    # === Server-only ===
    # Kept in base deps so single-process `uv run timetrace` works after a
    # vanilla `uv sync`. Headless server-only deploys can also live with
    # these extra installs — they're light and pure-Python.
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "aiosqlite>=0.20.0",
    "openai>=1.30.0",                  # VLM client (OpenAI-compatible chat)
    # === Windows-only (capture client) ===
    # Platform markers let `uv sync` succeed on Linux without these failing
    # to resolve. On Windows they install normally.
    "pywin32>=306; sys_platform == 'win32'",
    "mss>=9.0.0; sys_platform == 'win32'",
    "pynput>=1.7.0; sys_platform == 'win32'",
    "pystray>=0.19.0; sys_platform == 'win32'",
]

[project.scripts]
# Single-process all-in-one (capture + API + DB + worker + tray). Stable default.
timetrace = "timetrace.main:main"
# Two-process split (P3a-5b). Run alongside each other for loopback,
# or deploy server on a remote host and point client.toml at it.
timetrace-client = "timetrace.client.cli:main"
timetrace-server = "timetrace.server.cli:main"

# Optional-dependencies are forward-looking buckets that DON'T install
# today's union (that's already in `dependencies` above). They're for the
# adapter swaps that land in later phases — each maps to a section of the
# kickoff devlog (devlogs/infra/archive-202605151200-client-server-split-kickoff.md).
#
# Default deploy:
#   uv sync                       # full union (single-process default works)
#   uv sync --extra server-pg     # adds Postgres adapter (P5)
#   uv sync --extra all-extras    # everything below
#
# Headless Linux server already works with default `uv sync` — Windows-only
# capture deps are platform-gated above, so they auto-skip on Linux.
[project.optional-dependencies]
# P4 — client-side privacy pipeline (OCR + classifier + blur).
client-priv = [
    # "paddleocr>=2.7.0",
    # "onnxruntime>=1.17.0",
]
# P5 — server alternative adapters.
server-pg = [
    # "asyncpg>=0.29.0",
]
server-redis = [
    # "redis>=5.0.0",
]
server-s3 = [
    # "boto3>=1.34.0",
]
# P6 — headless TUI client (Linux small box without GUI).
headless = [
    # "psutil>=5.9.0",
]
# Convenience: install every optional adapter at once. Empty until the
# above buckets get real entries.
all-extras = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/timetrace"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.9",
]
